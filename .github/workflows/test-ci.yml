name: Tests

on:
  # A branch is tested once, through its pull request.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of the supported band: an intermediate
        # release that fails on neither is not a plausible failure.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools_scm reads the tags

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # torch's CPU build: PyPI's carries the CUDA libraries, gigabytes this
      # runner has no device for.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install .[dev]

      # No device here, so this run is also the check that every CUDA-marked
      # test skips cleanly without one: -rs lists the skips. One worker per
      # core, each held to one thread so the workers do not contend.
      - name: Run the tests
        env:
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
          MKL_NUM_THREADS: 1
        run: pytest -q -rs -n auto --cov --cov-report=xml

      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: pulserver/mariepy
